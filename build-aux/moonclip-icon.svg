<!-- MoonClip brand mark: red->blue crescent moon + white play.
     Replica of the CSS logo (MoonClipLogo.css) and moonclip.souriscg.dev.
     Source for `pnpm tauri icon build-aux/moonclip-icon.svg`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.1" stop-color="#ef4444"/>
      <stop offset="0.9" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.1" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="0.9" stop-color="#3b82f6" stop-opacity="0.45"/>
    </linearGradient>
    <mask id="crescent">
      <rect x="160" y="242" width="540" height="540" fill="#fff"/>
      <circle cx="527" cy="512" r="238" fill="#000"/>
    </mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="#0d0f14"/>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <g mask="url(#crescent)">
    <circle cx="430" cy="512" r="270" fill="url(#moon)"/>
  </g>
  <circle cx="430" cy="512" r="270" fill="none" stroke="url(#glow)" stroke-width="26" filter="url(#soft)" opacity="0.8" mask="url(#crescent)"/>
  <polygon points="595,512 462,428 462,596" fill="#fff"/>
</svg>
