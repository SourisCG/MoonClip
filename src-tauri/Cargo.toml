[package]
name = "moonclip"
version = "0.1.0"
description = "MoonClip — open-source, local-first game clip recorder (Medal.tv alternative)"
authors = ["SourisCG"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moonclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
image = "0.25"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros"] }
rodio = "0.21"
# obs-websocket v5 client (control plane for the embedded OBS). No default
# features: plain ws:// on localhost, no TLS.
obws = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
# X11/XWayland window lookup for game detection + window capture targeting.
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
# WASAPI audio via the `wasapi` crate (loopback + mic + IAudioClock/QPCPosition);
# capture/encode runs through the bundled ffmpeg (`gfxcapture` =
# Windows.Graphics.Capture, D3D11 zero-copy). No DLL injection anywhere
# (anti-cheat safe).
wasapi = "0.24"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
"Win32_UI_Shell",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
